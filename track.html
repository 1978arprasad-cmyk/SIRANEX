<!doctype html>
<html lang="te">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>Track grievance · Prajadarbar</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icon-192.svg" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="gov-strip"></div>
    <div id="app-root"></div>

    <main class="page page--narrow">
      <h1 data-t="track_title">Track your grievance</h1>
      <p class="muted" data-t="track_subtitle">Enter the mobile number and Grievance ID.</p>

      <form id="track-form" class="card">
        <div class="field--row">
          <div class="field">
            <label data-t="field_mobile">Mobile number</label>
            <input id="t-mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required/>
          </div>
          <div class="field">
            <label data-t="track_gid">Grievance ID</label>
            <input id="t-gid" required placeholder="PJD-KMM-2026-00001"/>
          </div>
        </div>
        <button class="btn btn--primary btn--block" data-t="track_btn">Show status</button>
      </form>

      <div id="result" class="hidden"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/supabase-init.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/track-page.js"></script>
  </body>
</html>
